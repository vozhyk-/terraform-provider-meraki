name: Network Firmware Upgrades Staged Events Rollbacks
spec_endpoint: /networks/{networkId}/firmwareUpgrades/staged/events/rollbacks
rest_endpoint: /networks/%v/firmwareUpgrades/staged/events/rollbacks
no_data_source: true
no_update: true
no_delete: true
no_import: true
no_read: true
doc_category: Networks
test_variables: [test_org, test_network]
attributes:
  - tf_name: network_id
    type: String
    id: true
    reference: true
    description: Network ID
    example: L_123456
    test_value: meraki_network.test.id
  - model_name: reasons
    type: List
    description: The reason for rolling back the staged upgrade
    attributes:
      - model_name: category
        type: String
        mandatory: true
        description: Reason for the rollback
        example: performance
        enum_values: [broke old features, other, performance, stability, testing, unifying networks versions]
      - model_name: comment
        type: String
        mandatory: true
        description: Additional comment about the rollback
        example: Network was slower with the upgrade
  - model_name: stages
    type: List
    mandatory: true
    description: All completed or in-progress stages in the network with their new start times. All pending stages will be canceled
    attributes:
      - model_name: id
        type: String
        data_path: [group]
        description: ID of the Staged Upgrade Group
        example: "1234"
      - model_name: scheduledFor
        type: String
        data_path: [milestones]
        description: The start time of the staged upgrade stage. (In ISO-8601 format, in the time zone of the network.)
        example: "2018-02-11T00:00:00Z"
test_prerequisites: |2
  data "meraki_organization" "test" {
    name = var.test_org
  }
  resource "meraki_network" "test" {
    organization_id = data.meraki_organization.test.id
    name            = var.test_network
    product_types   = ["switch", "wireless", "appliance", "sensor", "camera"]
  }
